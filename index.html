<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VPN Светофор</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    background: #f5f5f5;
    font-family: Arial, sans-serif;
    color: #111;
    display: flex;
    justify-content: center;
    padding: 30px 16px;
}

.container {
    width: 100%;
    max-width: 420px;
}

/* Заголовок */
.title {
    font-size: 30px;
    font-weight: 900;
    margin-bottom: 22px;
}

/* Светофор */
.traffic-box {
    display: flex;
    justify-content: center;
    margin-bottom: 25px;
}

.traffic-light {
    width: 125px;
    padding: 14px;
    border-radius: 28px;
    background: linear-gradient(145deg, #303030, #090909);
    border: 3px solid #444;
    box-shadow:
        0 15px 30px rgba(0,0,0,.25),
        inset 0 2px 5px rgba(255,255,255,.15);
}

.light {
    width: 78px;
    height: 78px;
    margin: 10px auto;
    border-radius: 50%;
    background: #151515;
    border: 3px solid #050505;
    opacity: .3;
    transition: .3s;
}

/* Красный */
.red.active {
    opacity: 1;
    background: radial-gradient(
        circle at 35% 25%,
        #ffb0b0,
        #ff2020 40%,
        #850000 75%
    );
    box-shadow:
        0 0 30px #ff2020,
        inset 0 4px 8px white;
}

/* Жёлтый */
.yellow.active {
    opacity: 1;
    background: radial-gradient(
        circle at 35% 25%,
        #fff2a0,
        #ffd21c 40%,
        #8b6800 75%
    );
    box-shadow:
        0 0 30px #ffd21c,
        inset 0 4px 8px white;
}

/* Зелёный */
.green.active {
    opacity: 1;
    background: radial-gradient(
        circle at 35% 25%,
        #baffcf,
        #20e66b 40%,
        #087b35 75%
    );
    box-shadow:
        0 0 35px #20e66b,
        inset 0 4px 8px white;
}

/* Текущий статус */
.status {
    margin-bottom: 18px;
}

.status-title {
    font-size: 24px;
    font-weight: 900;
    margin-bottom: 7px;
}

.status-short {
    font-size: 16px;
    color: #555;
    line-height: 1.4;
}

/* Большая карточка */
.description {
    background: white;
    border: 2px solid #111;
    border-radius: 18px;
    padding: 22px;
    line-height: 1.55;
    box-shadow: 0 8px 0 #111;
}

.description-title {
    font-size: 19px;
    font-weight: 900;
    margin-bottom: 10px;
}

.description-text {
    font-size: 15px;
    color: #333;
}

/* Кнопки для демонстрации */
.buttons {
    display: flex;
    gap: 8px;
    margin-top: 25px;
}

button {
    flex: 1;
    padding: 13px 8px;
    border: 2px solid #111;
    border-radius: 12px;
    background: white;
    font-weight: 800;
    cursor: pointer;
}

button:hover {
    background: #111;
    color: white;
}
</style>
</head>

<body>

<div class="container">

    <div class="title">
        🚦 Состояние VPN
    </div>

    <!-- Светофор -->
    <div class="traffic-box">
        <div class="traffic-light">

            <div id="red" class="light red active"></div>

            <div id="yellow" class="light yellow"></div>

            <div id="green" class="light green"></div>

        </div>
    </div>

    <!-- Текущий статус -->
    <div class="status">

        <div id="statusTitle" class="status-title">
            🔴 VPN выключен
        </div>

        <div id="statusShort" class="status-short">
            VPN сейчас отключён, соединение работает напрямую.
        </div>

    </div>

    <!-- Большое описание -->
    <div class="description">

        <div class="description-title">
            Что сейчас происходит
        </div>

        <div id="descriptionText" class="description-text">
            VPN полностью отключён. Интернет-соединение работает напрямую,
            без использования VPN-сервера. Сайты и приложения подключаются
            обычным способом.
        </div>

    </div>

    <!-- Временные кнопки для проверки дизайна -->
    <div class="buttons">
        <button onclick="setStatus('red')">🔴 Выключен</button>
        <button onclick="setStatus('yellow')">🟡 Белые списки</button>
        <button onclick="setStatus('green')">🟢 Включён</button>
    </div>

</div>

<script>

function setStatus(type) {

    const red = document.getElementById("red");
    const yellow = document.getElementById("yellow");
    const green = document.getElementById("green");

    const title = document.getElementById("statusTitle");
    const short = document.getElementById("statusShort");
    const description = document.getElementById("descriptionText");

    red.classList.remove("active");
    yellow.classList.remove("active");
    green.classList.remove("active");

    if (type === "red") {

        red.classList.add("active");

        title.textContent = "🔴 VPN выключен";

        short.textContent =
            "VPN сейчас отключён, соединение работает напрямую.";

        description.textContent =
            "VPN полностью отключён. Интернет-соединение работает напрямую, " +
            "без использования VPN-сервера. Сайты и приложения подключаются " +
            "обычным способом.";

    }

    if (type === "yellow") {

        yellow.classList.add("active");

        title.textContent = "🟡 Белые списки включены";

        short.textContent =
            "VPN работает только для выбранных сайтов и приложений.";

        description.textContent =
            "Белые списки включены. Через VPN проходят только те сайты и " +
            "приложения, которые находятся в белом списке. Остальной трафик " +
            "продолжает использовать обычное интернет-соединение.";

    }

    if (type === "green") {

        green.classList.add("active");

        title.textContent = "🟢 VPN включён";

        short.textContent =
            "VPN полностью активен и используется для соединения.";

        description.textContent =
            "VPN полностью включён. Соединение проходит через выбранный " +
            "VPN-сервер, а VPN применяется ко всему подходящему трафику. " +
            "Сейчас сервис работает в обычном режиме VPN.";

    }
}

</script>

</body>
</html>
