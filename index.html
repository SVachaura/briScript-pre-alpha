<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Svetofor VPN</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    background: #f4f4f4;
    font-family: Arial, sans-serif;
    color: #111;
    padding: 30px 16px;
}

.container {
    max-width: 430px;
    margin: auto;
}

h1 {
    font-size: 30px;
    margin: 0 0 25px;
    font-weight: 900;
}

/* СВЕТОФОР */

.traffic-wrap {
    display: flex;
    justify-content: center;
    margin-bottom: 25px;
}

.traffic {
    width: 130px;
    padding: 12px;
    border-radius: 28px;
    background: linear-gradient(145deg, #333, #090909);
    border: 3px solid #444;
    box-shadow:
        0 15px 35px rgba(0,0,0,.3),
        inset 0 2px 5px rgba(255,255,255,.15);
}

.light {
    width: 82px;
    height: 82px;
    margin: 10px auto;
    border-radius: 50%;
    background: #141414;
    border: 3px solid #050505;
    opacity: .25;
    transition: .4s;
}

/* RED */

.red.active {
    opacity: 1;
    background: radial-gradient(
        circle at 35% 25%,
        #ffbaba,
        #ff2222 40%,
        #800000 75%
    );

    box-shadow:
        0 0 35px #ff2222,
        inset 0 4px 8px white;
}

/* YELLOW */

.yellow.active {
    opacity: 1;
    background: radial-gradient(
        circle at 35% 25%,
        #fff4ad,
        #ffd21c 40%,
        #8b6800 75%
    );

    box-shadow:
        0 0 35px #ffd21c,
        inset 0 4px 8px white;
}

/* GREEN */

.green.active {
    opacity: 1;
    background: radial-gradient(
        circle at 35% 25%,
        #baffcf,
        #20e66b 40%,
        #087b35 75%
    );

    box-shadow:
        0 0 40px #20e66b,
        inset 0 4px 8px white;
}

/* STATUS */

.status-title {
    font-size: 25px;
    font-weight: 900;
    margin-bottom: 7px;
}

.status-short {
    color: #555;
    font-size: 16px;
    line-height: 1.45;
}

/* DESCRIPTION */

.description {
    margin-top: 20px;
    padding: 22px;
    background: white;
    border: 2px solid #111;
    border-radius: 18px;
    box-shadow: 0 8px 0 #111;
}

.description-title {
    font-size: 19px;
    font-weight: 900;
    margin-bottom: 10px;
}

.description-text {
    color: #333;
    line-height: 1.55;
}

/* IP */

.ip {
    margin-top: 20px;
    color: #777;
    font-size: 13px;
    text-align: center;
}
</style>
</head>

<body>

<div class="container">

    <h1>🚦 Svetofor</h1>

    <div class="traffic-wrap">

        <div class="traffic">

            <div id="red" class="light red"></div>

            <div id="yellow" class="light yellow active"></div>

            <div id="green" class="light green"></div>

        </div>

    </div>

    <div class="status-title" id="statusTitle">
        🟡 Проверка соединения
    </div>

    <div class="status-short" id="statusShort">
        Svetofor автоматически проверяет ваше интернет-соединение.
    </div>

    <div class="description">

        <div class="description-title">
            Что сейчас происходит
        </div>

        <div class="description-text" id="descriptionText">
            Подождите немного. Мы определяем ваш публичный IP-адрес
            и проверяем признаки VPN или прокси-соединения.
        </div>

    </div>

    <div class="ip" id="ip">
        Проверка IP...
    </div>

</div>


<script>

const red = document.getElementById("red");
const yellow = document.getElementById("yellow");
const green = document.getElementById("green");

const title = document.getElementById("statusTitle");
const short = document.getElementById("statusShort");
const description = document.getElementById("descriptionText");
const ipText = document.getElementById("ip");


function setLight(color) {

    red.classList.remove("active");
    yellow.classList.remove("active");
    green.classList.remove("active");

    if (color === "red") {
        red.classList.add("active");
    }

    if (color === "yellow") {
        yellow.classList.add("active");
    }

    if (color === "green") {
        green.classList.add("active");
    }
}


async function checkVPN() {

    // Жёлтый во время проверки
    setLight("yellow");

    title.textContent = "🟡 Проверка соединения";

    short.textContent =
        "Svetofor автоматически проверяет ваше интернет-соединение.";

    description.textContent =
        "Подождите немного. Мы определяем ваш публичный IP-адрес " +
        "и проверяем признаки VPN или прокси-соединения.";

    try {

        const response = await fetch(
            "https://ipapi.co/json/",
            {
                cache: "no-store"
            }
        );

        if (!response.ok) {
            throw new Error("IP API error");
        }

        const data = await response.json();

        ipText.textContent =
            "IP: " + (data.ip || "не определён");


        /*
         * ipapi.co может передавать признаки VPN/прокси
         * в некоторых ответах через threat.
         */

        const threat = data.threat || {};

        const isVPN =
            threat.is_vpn === true ||
            threat.is_proxy === true ||
            threat.is_tor === true ||
            threat.is_threat === true;


        if (isVPN) {

            // 🟢 VPN
            setLight("green");

            title.textContent =
                "🟢 VPN включён";

            short.textContent =
                "VPN-соединение обнаружено.";

            description.textContent =
                "Svetofor обнаружил признаки VPN или прокси-соединения. " +
                "Ваш текущий IP связан с VPN, прокси или другим " +
                "промежуточным соединением.";

        } else {

            // 🔴 VPN нет
            setLight("red");

            title.textContent =
                "🔴 VPN выключен";

            short.textContent =
                "VPN-соединение не обнаружено.";

            description.textContent =
                "Сейчас соединение выглядит как обычное интернет-соединение. " +
                "Svetofor не обнаружил признаков VPN или прокси для вашего " +
                "текущего публичного IP-адреса.";

        }

    } catch (error) {

        // Если API не отвечает
        setLight("yellow");

        title.textContent =
            "🟡 Не удалось проверить";

        short.textContent =
            "Не удалось определить состояние соединения.";

        description.textContent =
            "Сервис проверки IP временно недоступен или запрос был " +
            "заблокирован. Попробуйте обновить страницу немного позже.";

        ipText.textContent =
            "IP: проверка недоступна";
    }
}


// Запускаем автоматически
checkVPN();

</script>

</body>
</html>
