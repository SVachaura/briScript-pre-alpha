<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YouChat</title>

<style>
* {
  box-sizing: border-box;
}

:root {
  --blue: #3478f6;
  --blue2: #6ba5ff;
  --bg: #f3f7ff;
  --text: #192943;
  --muted: #8492a9;
}

body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 22px;
  font-family: Arial, sans-serif;
  color: var(--text);
  background:
    radial-gradient(circle at 15% 15%, #dceaff, transparent 35%),
    radial-gradient(circle at 90% 85%, #d7e7ff, transparent 35%),
    var(--bg);
}

.app {
  width: 100%;
  max-width: 410px;
  animation: appear .9s ease both;
}

.logo {
  text-align: center;
  margin-bottom: 28px;
  animation: float 4s ease-in-out infinite;
}

.logo-icon {
  width: 70px;
  height: 70px;
  display: grid;
  place-items: center;
  margin: 0 auto 12px;
  border-radius: 25px;
  color: white;
  font-size: 34px;
  background: linear-gradient(135deg, #4c91ff, #2461e9);
  box-shadow: 0 12px 30px #3478f640;
}

.logo h1 {
  margin: 0;
  font-size: 35px;
  letter-spacing: -1.5px;
}

.logo h1 span {
  color: var(--blue);
}

.logo p {
  color: var(--muted);
  margin-top: 9px;
}

.card {
  padding: 25px;
  border: 1px solid #ffffff;
  border-radius: 27px;
  background: #ffffffd9;
  box-shadow: 0 20px 60px #315b9510;
  backdrop-filter: blur(20px);
}

.tabs {
  display: flex;
  gap: 5px;
  padding: 5px;
  border-radius: 15px;
  background: #edf2fb;
  margin-bottom: 25px;
}

.tabs button {
  flex: 1;
  border: 0;
  border-radius: 11px;
  padding: 12px;
  background: transparent;
  color: #71819a;
  cursor: pointer;
  transition: .4s ease;
}

.tabs button.active {
  color: white;
  background: var(--blue);
  box-shadow: 0 5px 15px #3478f633;
}

h2 {
  margin: 0 0 8px;
  font-size: 25px;
}

.subtitle {
  margin: 0 0 23px;
  color: var(--muted);
  line-height: 1.5;
  font-size: 14px;
}

.field {
  margin-bottom: 17px;
}

label {
  display: block;
  font-size: 13px;
  font-weight: bold;
  margin-bottom: 9px;
}

.input-wrap {
  position: relative;
}

input {
  width: 100%;
  border: 1px solid #e1e8f3;
  border-radius: 14px;
  background: #f8faff;
  padding: 15px;
  outline: none;
  font-size: 15px;
  color: var(--text);
  transition: border .3s, box-shadow .3s, background .3s;
}

input:focus {
  border-color: var(--blue);
  background: white;
  box-shadow: 0 0 0 4px #3478f615;
}

.hint {
  margin-top: 7px;
  font-size: 11px;
  color: var(--muted);
}

.hint.good {
  color: #159568;
}

.hint.bad {
  color: #d94c60;
}

.primary {
  width: 100%;
  margin-top: 8px;
  padding: 16px;
  border: none;
  border-radius: 15px;
  color: white;
  font-size: 15px;
  font-weight: bold;
  background: linear-gradient(110deg, #438bff, #2867ed);
  box-shadow: 0 9px 22px #3478f630;
  cursor: pointer;
  transition: transform .3s, box-shadow .3s;
}

.primary:hover {
  transform: translateY(-3px);
  box-shadow: 0 13px 28px #3478f640;
}

.primary:active {
  transform: scale(.97);
}

.footer {
  text-align: center;
  color: var(--muted);
  font-size: 12px;
  line-height: 1.6;
  margin-top: 20px;
}

.profile {
  display: flex;
  align-items: center;
  gap: 13px;
  padding: 15px;
  margin: 4px 0 20px;
  border: 1px solid #e4ecf8;
  border-radius: 17px;
  background: white;
  transition: .4s;
}

.avatar {
  width: 48px;
  height: 48px;
  flex-shrink: 0;
  display: grid;
  place-items: center;
  border-radius: 17px;
  color: white;
  font-size: 22px;
  background: linear-gradient(135deg, #77b1ff, #3478f6);
}

.profile-name {
  font-weight: bold;
  margin-bottom: 5px;
}

.profile-user {
  font-size: 13px;
  color: var(--blue);
}

.hidden {
  display: none;
}

.notice {
  display: none;
  margin-top: 15px;
  padding: 12px;
  border-radius: 12px;
  background: #e8f3ff;
  color: #2459a6;
  font-size: 13px;
  line-height: 1.5;
}

@keyframes appear {
  from { opacity: 0; transform: translateY(25px); }
  to { opacity: 1; transform: translateY(0); }
}

@keyframes float {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-5px); }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .01ms !important;
    transition-duration: .01ms !important;
  }
}
</style>
</head>

<body>
<main class="app">

  <header class="logo">
    <div class="logo-icon">✉</div>
    <h1>You<span>Chat</span></h1>
    <p>Твоё общение начинается здесь</p>
  </header>

  <section class="card">

    <div class="tabs">
      <button id="registerTab" class="active"
        onclick="setMode('register')">Регистрация</button>
      <button id="loginTab"
        onclick="setMode('login')">Вход</button>
    </div>

    <form id="authForm">
      <h2 id="heading">Создать аккаунт</h2>
      <p class="subtitle" id="subtitle">
        Заполни данные и присоединяйся к YouChat.
      </p>

      <div class="field" id="nameField">
        <label for="displayName">Имя пользователя</label>
        <input id="displayName" maxlength="40"
          placeholder="Например, Алекс" autocomplete="name">
      </div>

      <div class="field" id="usernameField">
        <label for="username">Username</label>
        <div class="input-wrap">
          <input id="username" maxlength="20"
            placeholder="alex_67"
            autocomplete="username"
            autocapitalize="none" spellcheck="false">
        </div>
        <div class="hint" id="usernameHint">
          Твой уникальный никнейм: @username
        </div>
      </div>

      <div class="field">
        <label for="email">Электронная почта</label>
        <input id="email" type="email"
          placeholder="you@example.com"
          autocomplete="email" required>
      </div>

      <div class="field">
        <label for="password">Пароль</label>
        <input id="password" type="password"
          placeholder="Минимум 8 символов"
          minlength="8" autocomplete="new-password" required>
      </div>

      <div class="field" id="confirmField">
        <label for="confirmPassword">Повтори пароль</label>
        <input id="confirmPassword" type="password"
          placeholder="Введи пароль ещё раз"
          autocomplete="new-password">
      </div>

      <button class="primary" id="submitButton" type="submit">
        Создать аккаунт →
      </button>

      <div class="notice" id="notice" role="status"></div>
    </form>

  </section>

  <div class="footer">
    YouChat · Общение без границ<br>
    Создано для твоих друзей и сообществ
  </div>

</main>

<script>
const $ = id => document.getElementById(id);
let mode = "register";

function setMode(nextMode) {
  mode = nextMode;

  $("registerTab").classList.toggle("active", mode === "register");
  $("loginTab").classList.toggle("active", mode === "login");

  $("heading").textContent = mode === "register"
    ? "Создать аккаунт" : "С возвращением!";

  $("subtitle").textContent = mode === "register"
    ? "Заполни данные и присоединяйся к YouChat."
    : "Войди, чтобы продолжить общение.";

  $("nameField").classList.toggle("hidden", mode === "login");
  $("usernameField").classList.toggle("hidden", mode === "login");
  $("confirmField").classList.toggle("hidden", mode === "login");

  $("displayName").required = mode === "register";
  $("username").required = mode === "register";
  $("confirmPassword").required = mode === "register";

  $("password").autocomplete = mode === "login"
    ? "current-password" : "new-password";

  $("submitButton").textContent = mode === "register"
    ? "Создать аккаунт →" : "Войти →";

  $("notice").style.display = "none";
}

$("username").addEventListener("input", () => {
  const value = $("username").value.replace(/^@/, "");
  const hint = $("usernameHint");
  const valid = /^[a-zA-Z0-9_]{3,20}$/.test(value);

  if (!value) {
    hint.textContent = "Твой уникальный никнейм: @username";
    hint.className = "hint";
  } else if (valid) {
    hint.textContent = "✓ Формат подходит: @" + value;
    hint.className = "hint good";
  } else {
    hint.textContent =
      "3–20 символов: латинские буквы, цифры и _";
    hint.className = "hint bad";
  }
});

$("authForm").addEventListener("submit", event => {
  event.preventDefault();

  const notice = $("notice");
  notice.style.display = "block";

  if (mode === "register") {
    const username = $("username").value.replace(/^@/, "");

    if (!/^[a-zA-Z0-9_]{3,20}$/.test(username)) {
      notice.textContent = "Проверь формат Username.";
      return;
    }

    if ($("password").value !== $("confirmPassword").value) {
      notice.textContent = "Пароли не совпадают.";
      return;
    }

    notice.textContent =
      "Интерфейс готов! Для настоящей регистрации " +
      "нужно подключить сервер авторизации.";
  } else {
    notice.textContent =
      "Для входа нужно подключить сервер авторизации.";
  }
});
</script>
</body>
</html>
